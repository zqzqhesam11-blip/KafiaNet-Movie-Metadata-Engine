plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kafianet.efootball.saf'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kafianet.efootball.saf'
        minSdk 24
        targetSdk 29
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        // This sideloaded companion deliberately targets API 29 for the
        // Android 12 SAF picker behavior tested with the Ziru_27 provider.
        disable 'ExpiredTargetSdkVersion'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}

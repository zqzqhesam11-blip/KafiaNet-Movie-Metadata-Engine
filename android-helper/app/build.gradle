plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kafianet.shizukubridge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kafianet.shizukubridge'
        minSdk 24
        targetSdk 29
        versionCode 18
        versionName '1.7.2'
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        // This helper is sideloaded by CN PlayHub, not distributed through Google Play.
        // Android 11+ SAF restrictions for Android/data are gated to apps targeting API 30+.
        disable 'ExpiredTargetSdkVersion'
    }

    buildTypes {
        release {
            // Release must be installable by ADB. Use the Gradle debug signing
            // config for this companion package; it does not sign the Windows app.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}

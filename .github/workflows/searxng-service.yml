name: SearXNG authenticated service

on:
  push:
    branches:
      - feature/kafianet-searxng-auth-20261031
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_auth_middleware.py' -v
      - name: Build container image
        run: docker build --pull -t kafianet-searxng-auth:test .
